<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vantage — Today's Games (Live)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #140B10;
    --panel: #1E1319;
    --panel-raised: #241722;
    --hairline: #33202B;
    --text: #F3EDEF;
    --text-muted: #A6919B;
    --text-faint: #6B5560;
    --orange: #F7941D;
    --pink: #F0466E;
    --purple: #A855F7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 920px; margin: 0 auto; padding: 0 0 4rem; }
  .gradient-bar { height: 4px; background: linear-gradient(90deg, var(--orange), var(--pink) 55%, var(--purple)); }

  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--hairline);
  }
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, var(--orange), var(--pink) 55%, var(--purple));
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .brand-name {
    font-size: 15px; font-weight: 600; letter-spacing: 0.01em;
    background: linear-gradient(90deg, var(--orange), var(--pink) 60%, var(--purple));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .nav-links { display: flex; gap: 1.5rem; align-items: center; font-size: 14px; color: var(--text-muted); }
  .nav-links a { color: inherit; text-decoration: none; }
  .nav-links a.active { color: var(--text); font-weight: 500; }
  .filter-select {
    background: var(--panel); border: 1px solid var(--hairline); color: var(--text);
    border-radius: 6px; padding: 6px 10px; font-size: 13px;
  }

  .status-banner {
    margin: 1.25rem 1.5rem 0; padding: 0.9rem 1.1rem; border-radius: 8px;
    font-size: 13px; border: 1px solid var(--hairline); background: var(--panel); color: var(--text-muted);
  }
  .status-banner.error { border-color: #E1546A; color: #E1546A; }
  .hidden { display: none !important; }

  .signal-feed { margin: 1.25rem 1.5rem 0; }
  .signal-feed-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
  .signal-feed-header {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-faint);
  }
  .signal-count { color: var(--pink); font-weight: 600; text-transform: none; letter-spacing: 0; }
  .signal-refresh {
    background: var(--panel); border: 1px solid var(--hairline); color: var(--text-muted);
    border-radius: 6px; padding: 5px 11px; font-size: 12px; cursor: pointer;
  }
  .signal-refresh:hover { border-color: var(--pink); color: var(--text); }
  .signal-refresh:disabled { opacity: 0.5; cursor: default; }
  .signal-tabs { display: flex; gap: 6px; margin-bottom: 0.7rem; }
  .signal-tab {
    background: transparent; border: 1px solid var(--hairline); color: var(--text-muted);
    border-radius: 20px; padding: 4px 12px; font-size: 11px; cursor: pointer;
  }
  .signal-tab.active { background: var(--panel-raised); color: var(--text); border-color: var(--pink); }
  .signal-pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--pink);
    box-shadow: 0 0 0 0 rgba(240,70,110,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(240,70,110,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(240,70,110,0); }
    100% { box-shadow: 0 0 0 0 rgba(240,70,110,0); }
  }
  .signal-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .signal-card {
    flex: none; width: 280px; background: var(--panel); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 0.8rem 0.9rem; text-decoration: none; color: inherit;
    transition: border-color 0.15s ease;
  }
  .signal-card:hover { border-color: var(--pink); }
  .signal-card.warning { border-left: 3px solid var(--pink); }
  .signal-card.info { border-left: 3px solid var(--purple); }
  .signal-card-head { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .signal-card-text { font-size: 13px; line-height: 1.45; color: var(--text); }
  .signal-empty { font-size: 13px; color: var(--text-faint); font-style: italic; padding: 0.5rem 0; }

  .day-header { padding: 1.75rem 1.5rem 1rem; }
  .day-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.01em; }
  .day-sub { font-size: 13px; color: var(--text-muted); }

  .game-list { margin: 0 1.5rem; }
  .game-row {
    display: grid; grid-template-columns: auto 1fr auto 160px auto;
    align-items: center; gap: 1rem;
    background: var(--panel); border: 1px solid var(--hairline); border-radius: 10px;
    padding: 0.9rem 1.1rem; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s ease;
    text-decoration: none; color: inherit;
  }
  .game-row:hover { border-color: var(--pink); background: var(--panel-raised); }

  .kickoff { font-size: 12px; color: var(--text-faint); width: 70px; }
  .teams { display: flex; flex-direction: column; gap: 4px; }
  .team-line { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .team-badge-sm { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; flex: none; color: #fff; }
  .team-line .score { margin-left: auto; color: var(--text-muted); font-size: 13px; }

  .status-chip { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--panel-raised); color: var(--text-muted); white-space: nowrap; }
  .status-chip.scheduled { color: var(--orange); background: rgba(247,148,29,0.12); }
  .status-chip.live { color: var(--pink); background: rgba(240,70,110,0.12); }

  .mini-gauge { display: flex; flex-direction: column; gap: 3px; }
  .mini-gauge-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); }
  .mini-track { height: 6px; border-radius: 3px; background: var(--panel-raised); overflow: hidden; }
  .mini-fill { background: var(--pink); height: 100%; }
  .no-prediction { font-size: 11px; color: var(--text-faint); font-style: italic; }

  .arrow { color: var(--text-faint); font-size: 16px; }

  @media (max-width: 640px) {
    .game-row { grid-template-columns: auto 1fr auto; }
    .mini-gauge, .status-chip { display: none; }
    .signal-card { width: 240px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="gradient-bar"></div>

  <div class="nav">
    <div class="brand-row">
      <div class="brand-mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
          <path d="M3 17 L9 11 L13 15 L21 6" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15 6 L21 6 L21 12" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="brand-name">Vantage</span>
    </div>
    <div class="nav-links">
      <a href="dashboard_live.html" class="active">Dashboard</a>
      <select id="status-filter" class="filter-select">
        <option value="">All games</option>
        <option value="scheduled">Scheduled</option>
        <option value="final">Final</option>
      </select>
    </div>
  </div>

  <div id="status" class="status-banner hidden"></div>

  <div class="signal-feed">
    <div class="signal-feed-top">
      <div class="signal-feed-header"><span class="signal-pulse"></span>Signal Feed <span class="signal-count" id="signal-count"></span></div>
      <button class="signal-refresh" id="signal-refresh">&#8635; Refresh</button>
    </div>
    <div class="signal-tabs" id="signal-tabs">
      <button class="signal-tab active" data-filter="">All</button>
      <button class="signal-tab" data-filter="model_disagreement">Disagreements</button>
      <button class="signal-tab" data-filter="low_confidence">Low Confidence</button>
    </div>
    <div class="signal-scroll" id="signal-scroll">
      <div class="signal-empty">Loading alerts...</div>
    </div>
  </div>

  <div class="day-header">
    <div class="day-title">NFL Games</div>
    <div class="day-sub" id="game-count"></div>
  </div>

  <div class="game-list" id="game-list"></div>

</div>
<script>
  var API_BASE = 'https://sports-analytics-platform-ida8.onrender.com';
  var statusEl = document.getElementById('status');
  var listEl = document.getElementById('game-list');
  var countEl = document.getElementById('game-count');
  var filterEl = document.getElementById('status-filter');
  var signalScrollEl = document.getElementById('signal-scroll');

  function showStatus(message, isError) {
    statusEl.textContent = message;
    statusEl.className = 'status-banner' + (isError ? ' error' : '');
    statusEl.classList.remove('hidden');
  }
  function hideStatus() { statusEl.classList.add('hidden'); }

  function badgeColorFor(name) {
    var hash = 0;
    for (var i = 0; i < name.length; i++) {
      hash = name.charCodeAt(i) + ((hash << 5) - hash);
    }
    return 'hsl(' + (Math.abs(hash) % 360) + ', 55%, 40%)';
  }

  function abbrFor(name) {
    var words = name.split(' ');
    if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
    return name.substring(0, 3).toUpperCase();
  }

  function formatKickoff(isoString) {
    var d = new Date(isoString);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  var ALERT_ICONS = {
    model_disagreement: '\u26A1',
    low_confidence: '\uD83D\uDD0D'
  };

  var currentAlerts = [];
  var currentFilter = '';

  function renderAlertCards(alerts) {
    signalScrollEl.innerHTML = '';
    if (!alerts || alerts.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'signal-empty';
      empty.textContent = currentAlerts.length === 0
        ? 'No active alerts right now -- models are in agreement across scheduled games.'
        : 'No alerts match this filter.';
      signalScrollEl.appendChild(empty);
      return;
    }
    alerts.forEach(function (a) {
      var card = document.createElement('a');
      card.className = 'signal-card ' + a.severity;
      card.href = 'game_detail_live.html?game=' + a.game_id;

      var head = document.createElement('div');
      head.className = 'signal-card-head';
      head.textContent = (ALERT_ICONS[a.alert_type] || '\u2022') + ' ' + a.alert_type.replace('_', ' ');

      var text = document.createElement('div');
      text.className = 'signal-card-text';
      text.textContent = a.message;

      card.appendChild(head);
      card.appendChild(text);
      signalScrollEl.appendChild(card);
    });
  }

  function applyFilterAndRender() {
    var filtered = currentFilter ? currentAlerts.filter(function (a) { return a.alert_type === currentFilter; }) : currentAlerts;
    renderAlertCards(filtered);
  }

  function renderAlerts(alerts) {
    currentAlerts = alerts || [];
    document.getElementById('signal-count').textContent = '(' + currentAlerts.length + ' active)';
    applyFilterAndRender();
  }

  document.querySelectorAll('.signal-tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.signal-tab').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentFilter = btn.getAttribute('data-filter');
      applyFilterAndRender();
    });
  });

  document.getElementById('signal-refresh').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'Refreshing...';
    fetch(API_BASE + '/alerts/nfl/generate', { method: 'POST' })
      .then(function () { return fetch(API_BASE + '/alerts/nfl'); })
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        renderAlerts(data.alerts);
        btn.disabled = false;
        btn.innerHTML = '&#8635; Refresh';
      })
      .catch(function () {
        btn.disabled = false;
        btn.innerHTML = '&#8635; Refresh';
      });
  });

  function loadAlerts() {
    fetch(API_BASE + '/alerts/nfl')
      .then(function (resp) { return resp.json(); })
      .then(function (data) { renderAlerts(data.alerts); })
      .catch(function () {
        signalScrollEl.innerHTML = '<div class="signal-empty">Could not load alerts.</div>';
      });
  }

  function renderGames(games) {
    listEl.innerHTML = '';
    countEl.textContent = games.length + (games.length === 1 ? ' game' : ' games');

    games.forEach(function (g) {
      var row = document.createElement('a');
      row.className = 'game-row';
      row.href = 'game_detail_live.html?game=' + g.game_id;

      var kickoff = document.createElement('span');
      kickoff.className = 'kickoff';
      kickoff.textContent = g.game_date ? formatKickoff(g.game_date) : '';
      row.appendChild(kickoff);

      var teams = document.createElement('div');
      teams.className = 'teams';

      [
        { name: g.away_team, score: g.away_score },
        { name: g.home_team, score: g.home_score },
      ].forEach(function (t) {
        var line = document.createElement('div');
        line.className = 'team-line';

        var badge = document.createElement('span');
        badge.className = 'team-badge-sm';
        badge.style.background = badgeColorFor(t.name || '?');
        badge.textContent = t.name ? abbrFor(t.name) : '?';
        line.appendChild(badge);

        var nameSpan = document.createElement('span');
        nameSpan.textContent = t.name || 'Unknown';
        line.appendChild(nameSpan);

        if (t.score !== null && t.score !== undefined) {
          var scoreSpan = document.createElement('span');
          scoreSpan.className = 'score';
          scoreSpan.textContent = t.score;
          line.appendChild(scoreSpan);
        }

        teams.appendChild(line);
      });
      row.appendChild(teams);

      var chip = document.createElement('span');
      chip.className = 'status-chip ' + g.status;
      chip.textContent = g.status.charAt(0).toUpperCase() + g.status.slice(1);
      row.appendChild(chip);

      var gauge = document.createElement('div');
      gauge.className = 'mini-gauge';
      if (g.elo_win_prob_home !== null && g.elo_win_prob_home !== undefined) {
        var pct = Math.round(g.elo_win_prob_home * 100);
        var labels = document.createElement('div');
        labels.className = 'mini-gauge-labels';
        labels.innerHTML = '<span>' + (g.home_team || '?') + ' ' + pct + '%</span>';
        var track = document.createElement('div');
        track.className = 'mini-track';
        var fill = document.createElement('div');
        fill.className = 'mini-fill';
        fill.style.width = pct + '%';
        track.appendChild(fill);
        gauge.appendChild(labels);
        gauge.appendChild(track);
      } else {
        var noPred = document.createElement('span');
        noPred.className = 'no-prediction';
        noPred.textContent = 'No prediction yet';
        gauge.appendChild(noPred);
      }
      row.appendChild(gauge);

      var arrow = document.createElement('span');
      arrow.className = 'arrow';
      arrow.textContent = '\u203A';
      row.appendChild(arrow);

      listEl.appendChild(row);
    });
  }

  function loadGames() {
    listEl.innerHTML = '';
    showStatus('Loading games from the backend...', false);

    var status = filterEl.value;
    var url = API_BASE + '/games/nfl?limit=50' + (status ? '&status=' + status : '');

    fetch(url)
      .then(function (resp) {
        if (!resp.ok) {
          return resp.json().catch(function () { return {}; }).then(function (err) {
            throw new Error(err.detail || ('Server returned ' + resp.status));
          });
        }
        return resp.json();
      })
      .then(function (data) {
        hideStatus();
        renderGames(data.games);
      })
      .catch(function (err) {
        showStatus('Could not load games: ' + err.message + ' (Is the backend running at ' + API_BASE + '?)', true);
      });
  }

  filterEl.addEventListener('change', loadGames);
  loadAlerts();
  loadGames();
</script>
</body>
</html>
