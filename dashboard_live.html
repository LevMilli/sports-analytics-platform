<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vantage — Today's Games (Live)</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23F7941D%22/%3E%3Cstop%20offset%3D%2255%25%22%20stop-color%3D%22%23F0466E%22/%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23A855F7%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%226%22%20fill%3D%22url%28%23g%29%22/%3E%3Cpath%20d%3D%22M3%2017%20L9%2011%20L13%2015%20L21%206%22%20stroke%3D%22white%22%20stroke-width%3D%222.5%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M15%206%20L21%206%20L21%2012%22%20stroke%3D%22white%22%20stroke-width%3D%222.5%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #140B10;
    --panel: #1E1319;
    --panel-raised: #241722;
    --hairline: #33202B;
    --text: #F3EDEF;
    --text-muted: #A6919B;
    --text-faint: #6B5560;
    --orange: #F7941D;
    --pink: #F0466E;
    --purple: #A855F7;
    --negative: #E1546A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 920px; margin: 0 auto; padding: 0 0 4rem; }
  .gradient-bar { height: 4px; background: linear-gradient(90deg, var(--orange), var(--pink) 55%, var(--purple)); }

  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--hairline);
  }
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, var(--orange), var(--pink) 55%, var(--purple));
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .brand-name {
    font-size: 15px; font-weight: 600; letter-spacing: 0.01em;
    background: linear-gradient(90deg, var(--orange), var(--pink) 60%, var(--purple));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .nav-links { display: flex; gap: 1.5rem; align-items: center; font-size: 14px; color: var(--text-muted); }
  .nav-links a { color: inherit; text-decoration: none; }
  .nav-links a.active { color: var(--text); font-weight: 500; }
  .filter-select {
    background: var(--panel); border: 1px solid var(--hairline); color: var(--text);
    border-radius: 6px; padding: 6px 10px; font-size: 13px;
  }
  .league-tabs { display: flex; gap: 4px; }
  .league-tab {
    background: transparent; border: 1px solid var(--hairline); color: var(--text-muted);
    border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  .league-tab.active { background: var(--panel-raised); color: var(--text); border-color: var(--pink); }
  .league-tab:hover:not(.active) { border-color: var(--text-muted); }

  .status-banner {
    margin: 1.25rem 1.5rem 0; padding: 0.9rem 1.1rem; border-radius: 8px;
    font-size: 13px; border: 1px solid var(--hairline); background: var(--panel); color: var(--text-muted);
  }
  .status-banner.error { border-color: #E1546A; color: #E1546A; }
  .hidden { display: none !important; }

  .mock-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--hairline);
    background: var(--panel); color: var(--text-muted); display: flex; align-items: center;
    justify-content: center; cursor: pointer; font-size: 13px;
  }
  .mock-btn:hover { border-color: var(--pink); color: var(--text); }
  .mock-btn.active { color: var(--pink); border-color: var(--pink); }
  .mock-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--hairline); color: var(--text);
    padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 200;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .mock-toast.show { opacity: 1; }

  .account-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--hairline);
    background: var(--panel); color: var(--text-muted); display: flex; align-items: center;
    justify-content: center; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .account-btn:hover { border-color: var(--pink); color: var(--text); }
  .account-btn.logged-in { background: linear-gradient(135deg, var(--orange), var(--pink) 55%, var(--purple)); color: #fff; border: none; }
  .account-wrap { position: relative; }
  .account-dropdown {
    position: absolute; top: 40px; right: 0; background: var(--panel); border: 1px solid var(--hairline);
    border-radius: 8px; padding: 0.5rem; min-width: 170px; z-index: 50;
  }
  .account-dropdown .email-label { font-size: 12px; color: var(--text-muted); padding: 6px 8px; border-bottom: 1px solid var(--hairline); margin-bottom: 4px; word-break: break-all; }
  .account-dropdown button { width: 100%; text-align: left; background: none; border: none; color: var(--text); padding: 8px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .account-dropdown button:hover { background: var(--panel-raised); }
  .account-dropdown a { display: block; padding: 8px; border-radius: 6px; color: var(--text); text-decoration: none; font-size: 13px; }
  .account-dropdown a:hover { background: var(--panel-raised); }

  .auth-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
    align-items: center; justify-content: center; z-index: 100; padding: 1rem;
  }
  .auth-modal {
    background: var(--panel); border: 1px solid var(--hairline); border-radius: 12px;
    padding: 1.75rem; width: 100%; max-width: 340px; position: relative;
  }
  .auth-close { position: absolute; top: 12px; right: 14px; background: none; border: none; color: var(--text-faint); font-size: 20px; cursor: pointer; line-height: 1; }
  .auth-close:hover { color: var(--text); }
  .auth-tabs { display: flex; gap: 4px; margin-bottom: 1.25rem; background: var(--bg); border-radius: 8px; padding: 3px; }
  .auth-tab { flex: 1; background: transparent; border: none; color: var(--text-muted); padding: 8px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .auth-tab.active { background: var(--hairline); color: var(--text); }
  .auth-field { width: 100%; background: var(--bg); border: 1px solid var(--hairline); color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 0.7rem; box-sizing: border-box; }
  .auth-field:focus { outline: none; border-color: var(--pink); }
  .auth-error { font-size: 12px; color: var(--negative); background: rgba(225,84,106,0.1); border: 1px solid rgba(225,84,106,0.25); border-radius: 6px; padding: 8px 10px; margin-bottom: 0.7rem; }
  .auth-submit { width: 100%; background: linear-gradient(90deg, var(--orange), var(--pink) 60%, var(--purple)); color: #1A0B0A; font-weight: 600; border: none; border-radius: 8px; padding: 11px; font-size: 14px; cursor: pointer; }
  .auth-submit:disabled { opacity: 0.6; cursor: default; }

  .signal-feed { margin: 1.25rem 1.5rem 0; }
  .signal-feed-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
  .signal-feed-header {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-faint);
  }
  .signal-count { color: var(--pink); font-weight: 600; text-transform: none; letter-spacing: 0; }
  .signal-refresh {
    background: var(--panel); border: 1px solid var(--hairline); color: var(--text-muted);
    border-radius: 6px; padding: 5px 11px; font-size: 12px; cursor: pointer;
  }
  .signal-refresh:hover { border-color: var(--pink); color: var(--text); }
  .signal-refresh:disabled { opacity: 0.5; cursor: default; }
  .signal-tabs { display: flex; gap: 6px; margin-bottom: 0.7rem; }
  .signal-tab {
    background: transparent; border: 1px solid var(--hairline); color: var(--text-muted);
    border-radius: 20px; padding: 4px 12px; font-size: 11px; cursor: pointer;
  }
  .signal-tab.active { background: var(--panel-raised); color: var(--text); border-color: var(--pink); }
  .signal-pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--pink);
    box-shadow: 0 0 0 0 rgba(240,70,110,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(240,70,110,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(240,70,110,0); }
    100% { box-shadow: 0 0 0 0 rgba(240,70,110,0); }
  }
  .signal-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .signal-card {
    flex: none; width: 280px; background: var(--panel); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 0.8rem 0.9rem; text-decoration: none; color: inherit;
    transition: border-color 0.15s ease;
  }
  .signal-card:hover { border-color: var(--pink); }
  .signal-card.warning { border-left: 3px solid var(--pink); }
  .signal-card.info { border-left: 3px solid var(--purple); }
  .signal-card-head { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .signal-card-text { font-size: 13px; line-height: 1.45; color: var(--text); }
  .signal-empty { font-size: 13px; color: var(--text-faint); font-style: italic; padding: 0.5rem 0; }

  .day-header { padding: 1.75rem 1.5rem 1rem; }
  .day-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.01em; }
  .day-sub { font-size: 13px; color: var(--text-muted); }

  .game-list { margin: 0 1.5rem; }
  .game-row {
    display: grid; grid-template-columns: auto 1fr auto 160px auto;
    align-items: center; gap: 1rem;
    background: var(--panel); border: 1px solid var(--hairline); border-radius: 10px;
    padding: 0.9rem 1.1rem; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s ease;
    text-decoration: none; color: inherit;
  }
  .game-row:hover { border-color: var(--pink); background: var(--panel-raised); }

  .kickoff { font-size: 12px; color: var(--text-faint); width: 70px; }
  .teams { display: flex; flex-direction: column; gap: 4px; }
  .team-line { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .team-badge-sm { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; flex: none; color: #fff; }
  .team-line .score { margin-left: auto; color: var(--text-muted); font-size: 13px; }

  .status-chip { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--panel-raised); color: var(--text-muted); white-space: nowrap; }
  .status-chip.scheduled { color: var(--orange); background: rgba(247,148,29,0.12); }
  .status-chip.live { color: var(--pink); background: rgba(240,70,110,0.12); }

  .mini-gauge { display: flex; flex-direction: column; gap: 3px; }
  .mini-gauge-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); }
  .mini-track { height: 6px; border-radius: 3px; background: var(--panel-raised); overflow: hidden; }
  .mini-fill { background: var(--pink); height: 100%; }
  .no-prediction { font-size: 11px; color: var(--text-faint); font-style: italic; }

  .arrow { color: var(--text-faint); font-size: 16px; }

  @media (max-width: 640px) {
    .game-row { grid-template-columns: auto 1fr auto; }
    .mini-gauge, .status-chip { display: none; }
    .signal-card { width: 240px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="gradient-bar"></div>

  <div class="nav">
    <a href="landing_live.html" class="brand-row" style="text-decoration:none;">
      <div class="brand-mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
          <path d="M3 17 L9 11 L13 15 L21 6" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15 6 L21 6 L21 12" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="brand-name">Vantage</span>
    </a>
    <div class="nav-links">
      <a href="dashboard_live.html" class="active">Dashboard</a>
      <a href="rankings_live.html">Rankings</a>
      <div class="league-tabs" id="league-tabs">
        <button class="league-tab active" data-league="nfl">NFL</button>
        <button class="league-tab" data-league="mlb">MLB</button>
        <button class="league-tab" data-league="nba">NBA</button>
      </div>
      <button class="mock-btn" id="share-btn" title="Share">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
      <button class="mock-btn" id="bookmark-btn" title="Save for later">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
      <div class="mock-toast" id="mock-toast"></div>
      <div class="account-wrap">
        <button class="account-btn" id="account-btn" title="Account">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 4-7 8-7s8 3 8 7"/>
          </svg>
        </button>
        <div class="account-dropdown hidden" id="account-dropdown">
          <div class="email-label" id="dropdown-email"></div>
          <a href="account_live.html">Account & Security</a>
          <button id="logout-btn">Log out</button>
        </div>
      </div>
    </div>
  </div>

  <div class="auth-overlay hidden" id="auth-overlay">
    <div class="auth-modal">
      <button class="auth-close" id="auth-close">&times;</button>
      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login" id="tab-login">Sign In</button>
        <button class="auth-tab" data-mode="signup" id="tab-signup">Sign Up</button>
      </div>
      <div class="auth-error hidden" id="auth-error"></div>
      <input type="email" class="auth-field" id="auth-email" placeholder="Email" autocomplete="email">
      <input type="password" class="auth-field" id="auth-password" placeholder="Password" autocomplete="current-password">
      <button class="auth-submit" id="auth-submit">Sign In</button>
    </div>
  </div>

  <div id="status" class="status-banner hidden"></div>

  <div class="signal-feed">
    <div class="signal-feed-top">
      <div class="signal-feed-header"><span class="signal-pulse"></span>Signal Feed <span class="signal-count" id="signal-count"></span></div>
      <button class="signal-refresh" id="signal-refresh">&#8635; Refresh</button>
    </div>
    <div class="signal-tabs" id="signal-tabs">
      <button class="signal-tab active" data-filter="">All</button>
      <button class="signal-tab" data-filter="model_disagreement">Disagreements</button>
      <button class="signal-tab" data-filter="low_confidence">Low Confidence</button>
    </div>
    <div class="signal-scroll" id="signal-scroll">
      <div class="signal-empty">Loading alerts...</div>
    </div>
  </div>

  <div class="day-header">
    <div class="day-title" id="day-title">NFL Games</div>
    <div class="day-sub" id="game-count"></div>
  </div>

  <div class="game-list" id="game-list"></div>

</div>
<script>
  var API_BASE = 'https://sports-analytics-platform-ida8.onrender.com';
  var statusEl = document.getElementById('status');
  var listEl = document.getElementById('game-list');
  var countEl = document.getElementById('game-count');
  var signalScrollEl = document.getElementById('signal-scroll');
  var currentLeague = 'nfl';

  function showStatus(message, isError) {
    statusEl.textContent = message;
    statusEl.className = 'status-banner' + (isError ? ' error' : '');
    statusEl.classList.remove('hidden');
  }
  function hideStatus() { statusEl.classList.add('hidden'); }

  function badgeColorFor(name) {
    var hash = 0;
    for (var i = 0; i < name.length; i++) {
      hash = name.charCodeAt(i) + ((hash << 5) - hash);
    }
    return 'hsl(' + (Math.abs(hash) % 360) + ', 55%, 40%)';
  }

  function abbrFor(name) {
    var words = name.split(' ');
    if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
    return name.substring(0, 3).toUpperCase();
  }

  function formatKickoff(isoString) {
    var d = new Date(isoString);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  var ALERT_ICONS = {
    model_disagreement: '\u26A1',
    low_confidence: '\uD83D\uDD0D'
  };

  var currentAlerts = [];
  var currentFilter = '';

  function renderAlertCards(alerts) {
    signalScrollEl.innerHTML = '';
    if (!alerts || alerts.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'signal-empty';
      empty.textContent = currentAlerts.length === 0
        ? 'No active alerts right now -- models are in agreement across scheduled games.'
        : 'No alerts match this filter.';
      signalScrollEl.appendChild(empty);
      return;
    }
    alerts.forEach(function (a) {
      var card = document.createElement('a');
      card.className = 'signal-card ' + a.severity;
      card.href = 'game_detail_live.html?game=' + a.game_id;

      var head = document.createElement('div');
      head.className = 'signal-card-head';
      var headIconSpan = document.createElement('span');
      headIconSpan.style.marginRight = '6px';
      headIconSpan.textContent = ALERT_ICONS[a.alert_type] || '\u2022';
      var headTextSpan = document.createElement('span');
      headTextSpan.textContent = a.alert_type.replace('_', ' ');
      head.appendChild(headIconSpan);
      head.appendChild(headTextSpan);

      var text = document.createElement('div');
      text.className = 'signal-card-text';
      text.textContent = a.message;

      card.appendChild(head);
      card.appendChild(text);
      signalScrollEl.appendChild(card);
    });
  }

  function applyFilterAndRender() {
    var filtered = currentFilter ? currentAlerts.filter(function (a) { return a.alert_type === currentFilter; }) : currentAlerts;
    renderAlertCards(filtered);
  }

  function renderAlerts(alerts) {
    currentAlerts = alerts || [];
    document.getElementById('signal-count').textContent = '(' + currentAlerts.length + ' active)';
    applyFilterAndRender();
  }

  document.querySelectorAll('.signal-tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.signal-tab').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentFilter = btn.getAttribute('data-filter');
      applyFilterAndRender();
    });
  });

  document.getElementById('signal-refresh').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'Refreshing...';
    fetch(API_BASE + '/alerts/nfl/generate', { method: 'POST' })
      .then(function () { return fetch(API_BASE + '/alerts/nfl'); })
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        renderAlerts(data.alerts);
        btn.disabled = false;
        btn.innerHTML = '&#8635; Refresh';
      })
      .catch(function () {
        btn.disabled = false;
        btn.innerHTML = '&#8635; Refresh';
      });
  });

  function loadAlerts() {
    fetch(API_BASE + '/alerts/nfl')
      .then(function (resp) { return resp.json(); })
      .then(function (data) { renderAlerts(data.alerts); })
      .catch(function () {
        signalScrollEl.innerHTML = '<div class="signal-empty">Could not load alerts.</div>';
      });
  }

  function renderGames(games) {
    listEl.innerHTML = '';
    countEl.textContent = games.length + (games.length === 1 ? ' game' : ' games');

    games.forEach(function (g) {
      var row = document.createElement('a');
      row.className = 'game-row';
      row.href = 'game_detail_live.html?game=' + g.game_id;

      var kickoff = document.createElement('span');
      kickoff.className = 'kickoff';
      kickoff.textContent = g.game_date ? formatKickoff(g.game_date) : '';
      row.appendChild(kickoff);

      var teams = document.createElement('div');
      teams.className = 'teams';

      [
        { name: g.away_team, score: g.away_score },
        { name: g.home_team, score: g.home_score },
      ].forEach(function (t) {
        var line = document.createElement('div');
        line.className = 'team-line';

        var badge = document.createElement('span');
        badge.className = 'team-badge-sm';
        badge.style.background = badgeColorFor(t.name || '?');
        badge.textContent = t.name ? abbrFor(t.name) : '?';
        line.appendChild(badge);

        var nameSpan = document.createElement('span');
        nameSpan.textContent = t.name || 'Unknown';
        line.appendChild(nameSpan);

        if (t.score !== null && t.score !== undefined) {
          var scoreSpan = document.createElement('span');
          scoreSpan.className = 'score';
          scoreSpan.textContent = t.score;
          line.appendChild(scoreSpan);
        }

        teams.appendChild(line);
      });
      row.appendChild(teams);

      var chip = document.createElement('span');
      chip.className = 'status-chip ' + g.status;
      chip.textContent = g.status.charAt(0).toUpperCase() + g.status.slice(1);
      row.appendChild(chip);

      var gauge = document.createElement('div');
      gauge.className = 'mini-gauge';
      if (g.elo_win_prob_home !== null && g.elo_win_prob_home !== undefined) {
        var pct = Math.round(g.elo_win_prob_home * 100);
        var labels = document.createElement('div');
        labels.className = 'mini-gauge-labels';
        labels.innerHTML = '<span>' + (g.home_team || '?') + ' ' + pct + '%</span>';
        var track = document.createElement('div');
        track.className = 'mini-track';
        var fill = document.createElement('div');
        fill.className = 'mini-fill';
        fill.style.width = pct + '%';
        track.appendChild(fill);
        gauge.appendChild(labels);
        gauge.appendChild(track);
      } else {
        var noPred = document.createElement('span');
        noPred.className = 'no-prediction';
        noPred.textContent = 'No prediction yet';
        gauge.appendChild(noPred);
      }
      row.appendChild(gauge);

      var arrow = document.createElement('span');
      arrow.className = 'arrow';
      arrow.textContent = '\u203A';
      row.appendChild(arrow);

      listEl.appendChild(row);
    });
  }

  function loadGames() {
    listEl.innerHTML = '';
    document.getElementById('day-title').textContent = currentLeague.toUpperCase() + ' Games';
    showStatus('Loading ' + currentLeague.toUpperCase() + ' games from the backend...', false);

    var url = API_BASE + '/games/' + currentLeague + '?limit=50';

    fetch(url)
      .then(function (resp) {
        if (!resp.ok) {
          return resp.json().catch(function () { return {}; }).then(function (err) {
            throw new Error(err.detail || ('Server returned ' + resp.status));
          });
        }
        return resp.json();
      })
      .then(function (data) {
        hideStatus();
        renderGames(data.games);
      })
      .catch(function (err) {
        showStatus('Could not load games: ' + err.message + ' (Is the backend running at ' + API_BASE + '?)', true);
      });
  }

  document.querySelectorAll('.league-tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.league-tab').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentLeague = btn.getAttribute('data-league');
      loadGames();
    });
  });

  loadAlerts();
  loadGames();

  var AUTH_TOKEN_KEY = 'vantage_token';
  var accountBtn = document.getElementById('account-btn');
  var accountDropdown = document.getElementById('account-dropdown');
  var dropdownEmail = document.getElementById('dropdown-email');
  var logoutBtn = document.getElementById('logout-btn');
  var authOverlay = document.getElementById('auth-overlay');
  var authCloseBtn = document.getElementById('auth-close');
  var authEmailInput = document.getElementById('auth-email');
  var authPasswordInput = document.getElementById('auth-password');
  var authSubmitBtn = document.getElementById('auth-submit');
  var authErrorEl = document.getElementById('auth-error');
  var tabLogin = document.getElementById('tab-login');
  var tabSignup = document.getElementById('tab-signup');
  var authMode = 'login';

  var PERSON_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>';

  function setAuthMode(mode) {
    authMode = mode;
    tabLogin.classList.toggle('active', mode === 'login');
    tabSignup.classList.toggle('active', mode === 'signup');
    authSubmitBtn.textContent = mode === 'login' ? 'Sign In' : 'Sign Up';
    authErrorEl.classList.add('hidden');
  }
  tabLogin.addEventListener('click', function () { setAuthMode('login'); });
  tabSignup.addEventListener('click', function () { setAuthMode('signup'); });

  function openAuthModal() {
    authOverlay.classList.remove('hidden');
    authEmailInput.value = '';
    authPasswordInput.value = '';
    authErrorEl.classList.add('hidden');
    setAuthMode('login');
  }
  function closeAuthModal() { authOverlay.classList.add('hidden'); }
  authCloseBtn.addEventListener('click', closeAuthModal);
  authOverlay.addEventListener('click', function (e) {
    if (e.target === authOverlay) closeAuthModal();
  });

  function showLoggedInUI(email) {
    accountBtn.classList.add('logged-in');
    accountBtn.innerHTML = email.charAt(0).toUpperCase();
    dropdownEmail.textContent = email;
  }
  function showLoggedOutUI() {
    accountBtn.classList.remove('logged-in');
    accountBtn.innerHTML = PERSON_ICON;
    accountDropdown.classList.add('hidden');
  }

  accountBtn.addEventListener('click', function () {
    var token = localStorage.getItem(AUTH_TOKEN_KEY);
    if (token) {
      accountDropdown.classList.toggle('hidden');
    } else {
      openAuthModal();
    }
  });

  logoutBtn.addEventListener('click', function () {
    var token = localStorage.getItem(AUTH_TOKEN_KEY);
    fetch(API_BASE + '/auth/logout', { method: 'POST', headers: { 'Authorization': token } })
      .catch(function () {})
      .then(function () {
        localStorage.removeItem(AUTH_TOKEN_KEY);
        showLoggedOutUI();
      });
  });

  authSubmitBtn.addEventListener('click', function () {
    var email = authEmailInput.value.trim();
    var password = authPasswordInput.value;
    if (!email || !password) {
      authErrorEl.textContent = 'Email and password are required.';
      authErrorEl.classList.remove('hidden');
      return;
    }
    authSubmitBtn.disabled = true;
    authSubmitBtn.textContent = authMode === 'login' ? 'Signing in...' : 'Signing up...';
    var endpoint = authMode === 'login' ? '/auth/login' : '/auth/signup';

    fetch(API_BASE + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    })
      .then(function (resp) {
        return resp.json().then(function (data) { return { ok: resp.ok, data: data }; });
      })
      .then(function (result) {
        authSubmitBtn.disabled = false;
        authSubmitBtn.textContent = authMode === 'login' ? 'Sign In' : 'Sign Up';
        if (!result.ok) {
          authErrorEl.textContent = result.data.detail || 'Something went wrong.';
          authErrorEl.classList.remove('hidden');
          return;
        }
        localStorage.setItem(AUTH_TOKEN_KEY, result.data.token);
        showLoggedInUI(result.data.email);
        closeAuthModal();
      })
      .catch(function () {
        authSubmitBtn.disabled = false;
        authSubmitBtn.textContent = authMode === 'login' ? 'Sign In' : 'Sign Up';
        authErrorEl.textContent = 'Could not reach the server.';
        authErrorEl.classList.remove('hidden');
      });
  });

  (function checkExistingSession() {
    var token = localStorage.getItem(AUTH_TOKEN_KEY);
    if (!token) {
      showLoggedOutUI();
      return;
    }
    fetch(API_BASE + '/auth/me', { headers: { 'Authorization': token } })
      .then(function (resp) {
        if (!resp.ok) throw new Error('invalid session');
        return resp.json();
      })
      .then(function (data) { showLoggedInUI(data.email); })
      .catch(function () {
        localStorage.removeItem(AUTH_TOKEN_KEY);
        showLoggedOutUI();
      });
  })();

  function showMockToast(msg) {
    var toast = document.getElementById('mock-toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 2000);
  }
  document.getElementById('share-btn').addEventListener('click', function () {
    navigator.clipboard.writeText(window.location.href).then(function () {
      showMockToast('Link copied to clipboard');
    }).catch(function () {
      showMockToast('Could not copy link');
    });
  });
  document.getElementById('bookmark-btn').addEventListener('click', function () {
    this.classList.toggle('active');
    showMockToast(this.classList.contains('active') ? 'Saved (this session only)' : 'Removed');
  });
</script>
</body>
</html>
